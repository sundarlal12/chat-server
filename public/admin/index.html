<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<style>
  /* Light (default) matches the main PAPA777 admin dashboard's red/white
     theme; dark is a toggleable alternate - see the theme-toggle button
     in the header. Everything below reads colors from these variables
     rather than hardcoding them, so the toggle just flips one attribute. */
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-alt: #fafafb;
    --border: #e6e8ec;
    --text: #1f2430;
    --text-muted: #6b7280;
    --text-faint: #9aa1ae;
    --brand: #e0263b;
    --brand-hover: #c81f32;
    --brand-soft: #fdeaec;
    --success-bg: #e5f7ec;
    --success-text: #17924a;
    --danger-bg: #fdeaec;
    --danger-text: #e0263b;
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
    --out-bubble-text: #ffffff;
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-alt: #1c2028;
    --border: #262b36;
    --text: #e6e8eb;
    --text-muted: #8a93a3;
    --text-faint: #5a6273;
    --brand: #e0263b;
    --brand-hover: #ff4d5e;
    --brand-soft: #3a1c22;
    --success-bg: #1f4d2f;
    --success-text: #6fd88f;
    --danger-bg: #3a2323;
    --danger-text: #ff9d9d;
    --shadow: none;
    --out-bubble-text: #ffffff;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
  }
  .hidden { display: none !important; }

  /* ---------- Login ---------- */
  #login-screen {
    height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg);
  }
  #login-box {
    width: 320px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 28px; box-shadow: var(--shadow);
  }
  #login-logo {
    display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  }
  #login-logo .badge {
    width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  #login-logo .name { font-size: 17px; font-weight: 700; letter-spacing: 0.2px; }
  #login-box p.sub { color: var(--text-muted); font-size: 13px; margin: 0 0 20px; }
  #login-box input {
    width: 100%; padding: 10px 12px; margin-bottom: 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); font-size: 14px;
  }
  #login-box input:focus { outline: none; border-color: var(--brand); }
  #login-box button {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: none;
    background: var(--brand); color: white; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  #login-box button:hover { background: var(--brand-hover); }
  #login-error { color: var(--danger-text); font-size: 13px; margin: 0 0 12px; min-height: 16px; }

  /* ---------- App shell ---------- */
  #app-screen { display: flex; flex-direction: column; height: 100vh; }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0;
    box-shadow: var(--shadow);
  }
  header .brand { display: flex; align-items: center; gap: 10px; }
  header .brand .badge {
    width: 32px; height: 32px; border-radius: 9px; background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px;
  }
  header .brand .name { font-size: 15px; font-weight: 700; letter-spacing: 0.2px; }
  header .brand .name small { display: block; font-weight: 500; font-size: 11px; color: var(--text-muted); }
  header .header-actions { display: flex; align-items: center; gap: 10px; }
  header .who { color: var(--text-muted); font-size: 12px; margin-right: 2px; }
  .icon-btn {
    width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface-alt);
    color: var(--text-muted); display: flex; align-items: center; justify-content: center; font-size: 15px;
    cursor: pointer; padding: 0; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--brand-soft); color: var(--brand); border-color: var(--brand-soft); }
  #avatar-badge {
    width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 13px;
    font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  header button#logout-btn {
    background: none; border: 1px solid var(--border); color: var(--text-muted); padding: 7px 12px;
    border-radius: 7px; font-size: 12px; cursor: pointer; font-weight: 600;
  }
  header button#logout-btn:hover { background: var(--danger-bg); color: var(--danger-text); border-color: var(--danger-bg); }

  #main { flex: 1; display: flex; min-height: 0; }

  /* ---------- Ticket list ---------- */
  #ticket-panel { width: 320px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; flex-shrink: 0; }
  #ticket-search-box { padding: 12px 12px 0; }
  #ticket-search {
    width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 13px;
  }
  #ticket-search:focus { outline: none; border-color: var(--brand); }
  #status-tabs { display: flex; gap: 6px; padding: 12px; border-bottom: 1px solid var(--border); }
  #status-tabs button {
    flex: 1; background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); padding: 7px 0;
    border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #status-tabs button.active { background: var(--brand); border-color: var(--brand); color: white; }
  #ticket-list { flex: 1; overflow-y: auto; }
  .ticket-row {
    padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; position: relative;
  }
  .ticket-row:hover { background: var(--surface-alt); }
  .ticket-row.selected { background: var(--brand-soft); }
  .ticket-row .name { font-size: 13px; font-weight: 600; margin-bottom: 3px; color: var(--text); }
  .ticket-row .phone { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
  .ticket-row .subject { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ticket-row .meta { font-size: 11px; color: var(--text-faint); margin-top: 5px; display: flex; justify-content: space-between; }
  .badge {
    display: inline-block; font-size: 10px; padding: 2px 7px; border-radius: 10px; text-transform: uppercase; font-weight: 700;
  }
  .badge.open { background: var(--success-bg); color: var(--success-text); }
  .badge.closed { background: var(--danger-bg); color: var(--danger-text); }
  #ticket-empty { padding: 20px 16px; color: var(--text-faint); font-size: 13px; }

  /* ---------- Chat panel ---------- */
  #chat-panel { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
  #chat-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; color: var(--text-faint); font-size: 13px; }
  #chat-header { padding: 14px 18px; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #chat-header .name { font-size: 14px; font-weight: 700; color: var(--text); }
  #chat-header .name .phone { font-size: 12px; font-weight: 500; color: var(--text-muted); }
  #chat-header .subject { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  #end-chat-btn {
    flex-shrink: 0; background: var(--surface-alt); color: var(--danger-text); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  #end-chat-btn:hover { background: var(--danger-bg); }
  #end-chat-btn:disabled { opacity: 0.5; cursor: default; }
  .header-btns { flex-shrink: 0; display: flex; gap: 8px; }
  .secondary-btn {
    background: var(--surface-alt); color: var(--text-muted); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .secondary-btn:hover { background: var(--brand-soft); color: var(--brand); }
  #ticket-history-panel { border-bottom: 1px solid var(--border); background: var(--surface-alt); max-height: 220px; overflow-y: auto; }
  #ticket-history-panel .history-row {
    padding: 10px 18px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 12px;
  }
  #ticket-history-panel .history-row:hover { background: var(--brand-soft); }
  #ticket-history-panel .history-row.current { background: var(--brand-soft); cursor: default; }
  #ticket-history-panel .history-row .subject { font-weight: 600; color: var(--text); }
  #ticket-history-panel .history-row .meta { color: var(--text-muted); margin-top: 2px; display: flex; justify-content: space-between; }
  #ticket-history-empty { padding: 14px 18px; color: var(--text-faint); font-size: 12px; }
  #messages { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 60%; padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.4; word-wrap: break-word; box-shadow: var(--shadow); }
  .msg.in { align-self: flex-start; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 3px; }
  .msg.out { align-self: flex-end; background: var(--brand); color: var(--out-bubble-text); border-bottom-right-radius: 3px; }
  .msg .time { display: block; font-size: 10px; opacity: 0.7; margin-top: 4px; }
  .msg img.att, .msg video.att { max-width: 220px; border-radius: 8px; display: block; margin-top: 6px; }
  .msg audio { display: block; margin-top: 6px; max-width: 220px; }
  .msg a.att-link { display: inline-block; margin-top: 6px; font-size: 12px; color: inherit; text-decoration: underline; }

  #composer { border-top: 1px solid var(--border); background: var(--surface); padding: 10px 16px; display: flex; gap: 8px; align-items: flex-end; }
  #composer textarea {
    flex: 1; resize: none; min-height: 38px; max-height: 120px; padding: 9px 12px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface-alt); color: var(--text); font-size: 13px; font-family: inherit;
  }
  #composer textarea:focus { outline: none; border-color: var(--brand); }
  #composer button, #composer label.icon-btn {
    background: var(--surface-alt); border: 1px solid var(--border); color: var(--text-muted); padding: 9px 12px; border-radius: 9px;
    font-size: 13px; cursor: pointer; flex-shrink: 0; width: auto; height: auto;
  }
  #composer button.primary { background: var(--brand); border-color: var(--brand); color: white; font-weight: 700; }
  #composer button.primary:hover { background: var(--brand-hover); }
  #composer button:hover { filter: brightness(1.03); }
  #composer button:disabled { opacity: 0.5; cursor: default; }
  #voice-btn.recording { background: var(--danger-bg); border-color: var(--brand); color: var(--brand); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  #pending-file { font-size: 11px; color: var(--text-muted); padding: 0 16px 8px; background: var(--surface); }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <div id="login-logo"><span class="badge">P</span><span class="name">PAPA777</span></div>
    <p class="sub">Sign in with your chat-admin account.</p>
    <p id="login-error"></p>
    <input id="login-username" type="text" placeholder="Username" autocomplete="username" />
    <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="login-btn">Log in</button>
  </div>
</div>

<div id="app-screen" class="hidden">
  <header>
    <div class="brand">
      <span class="badge">P</span>
      <span class="name">PAPA777<small>Chat Admin</small></span>
    </div>
    <div class="header-actions">
      <span class="who" id="who-label"></span>
      <a class="icon-btn" href="/admin/whatsapp" title="WhatsApp connection" aria-label="WhatsApp connection" style="text-decoration:none;">🟢</a>
      <button class="icon-btn" id="notif-btn" title="Notifications" aria-label="Notifications">🔔</button>
      <button class="icon-btn" id="theme-toggle-btn" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      <div id="avatar-badge"></div>
      <button id="logout-btn">Log out</button>
    </div>
  </header>
  <div id="main">
    <div id="ticket-panel">
      <div id="ticket-search-box">
        <input id="ticket-search" type="text" placeholder="Search name or mobile…" />
      </div>
      <div id="status-tabs">
        <button data-status="open" class="active">Open</button>
        <button data-status="closed">Closed</button>
        <button data-status="">All</button>
      </div>
      <div id="ticket-list"></div>
    </div>
    <div id="chat-panel">
      <div id="chat-placeholder">Select a conversation on the left</div>
    </div>
  </div>
</div>

<script>
(function () {
  const API = '/admin/api';
  let token = localStorage.getItem('chatAdminToken') || '';
  let adminInfo = null;
  let socket = null;
  let currentStatus = 'open';
  let currentSearch = '';
  let searchDebounceTimer = null;
  let currentTicketId = null;
  let currentTicket = null;
  let renderedMessageIds = new Set();
  let pendingFile = null;
  let ticketRefreshTimer = null;
  let mediaRecorder = null;
  let recordedChunks = [];

  const $ = (sel) => document.querySelector(sel);
  const loginScreen = $('#login-screen');
  const appScreen = $('#app-screen');

  // ---------- Theme ----------
  // Light (red/white, matching the main PAPA777 admin dashboard) is the
  // default; persisted choice overrides it. Toggle icon shows the mode a
  // click would switch TO (moon while light, sun while dark).
  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const btn = $('#theme-toggle-btn');
    if (btn) { btn.textContent = theme === 'dark' ? '☀️' : '🌙'; }
  }
  applyTheme(localStorage.getItem('chatAdminTheme') || 'light');
  document.addEventListener('DOMContentLoaded', () => {
    $('#theme-toggle-btn').addEventListener('click', () => {
      const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      localStorage.setItem('chatAdminTheme', next);
      applyTheme(next);
    });
  });

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  async function api(path, opts = {}) {
    const res = await fetch(API + path, {
      ...opts,
      headers: {
        ...(opts.body && !(opts.body instanceof FormData) ? { 'Content-Type': 'application/json' } : {}),
        ...(token ? { Authorization: 'Bearer ' + token } : {}),
        ...(opts.headers || {}),
      },
    });
    if (res.status === 401) { logout(); throw new Error('Please log in'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) { throw new Error(data.message || 'Request failed'); }
    return data;
  }

  // ---------- Auth ----------
  $('#login-btn').addEventListener('click', doLogin);
  $('#login-password').addEventListener('keydown', (e) => { if (e.key === 'Enter') { doLogin(); } });

  async function doLogin() {
    const username = $('#login-username').value.trim();
    const password = $('#login-password').value;
    $('#login-error').textContent = '';
    if (!username || !password) { $('#login-error').textContent = 'Enter a username and password.'; return; }
    try {
      const data = await api('/login', { method: 'POST', body: JSON.stringify({ username, password }) });
      token = data.token;
      adminInfo = data.admin;
      localStorage.setItem('chatAdminToken', token);
      enterApp();
    } catch (e) {
      $('#login-error').textContent = e.message || 'Login failed';
    }
  }

  $('#logout-btn').addEventListener('click', logout);
  function logout() {
    token = '';
    localStorage.removeItem('chatAdminToken');
    if (socket) { socket.disconnect(); socket = null; }
    currentTicketId = null;
    appScreen.classList.add('hidden');
    loginScreen.classList.remove('hidden');
  }

  async function enterApp() {
    loginScreen.classList.add('hidden');
    appScreen.classList.remove('hidden');
    const label = adminInfo ? adminInfo.displayName : '';
    $('#who-label').textContent = label;
    $('#avatar-badge').textContent = (label || '?').trim().charAt(0).toUpperCase();
    connectSocket();
    await loadTickets();
  }

  // ---------- Socket ----------
  function connectSocket() {
    socket = io({ path: '/socket.io/', query: { adminToken: token } });
    // The app has two separate incoming-message events - "send-message"
    // (text, singular `messageDoc`) and "send-file-message" (attachments,
    // plural `messageDocs` - confirmed via a live captured trace) - so both
    // need a listener here, not just the first one, and each carries a
    // different shape.
    const onIncoming = (data) => {
      if (!data || !data.success) { return; }
      const docs = data.messageDocs || (data.messageDoc ? [data.messageDoc] : []);
      for (const doc of docs) {
        if (String(doc.ticketId) === String(currentTicketId)) { appendMessage(doc); }
      }
    };
    socket.on('send-message', onIncoming);
    socket.on('send-file-message', onIncoming);
    socket.on('admin:ticket-activity', () => {
      clearTimeout(ticketRefreshTimer);
      ticketRefreshTimer = setTimeout(loadTickets, 400);
    });
  }

  // ---------- Ticket list ----------
  document.querySelectorAll('#status-tabs button').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#status-tabs button').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentStatus = btn.dataset.status;
      loadTickets();
    });
  });

  $('#ticket-search').addEventListener('input', (e) => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(() => {
      currentSearch = e.target.value.trim();
      loadTickets();
    }, 300);
  });

  async function loadTickets() {
    let data;
    try {
      const params = new URLSearchParams({ limit: '100' });
      if (currentStatus) { params.set('status', currentStatus); }
      if (currentSearch) { params.set('search', currentSearch); }
      data = await api('/tickets?' + params.toString());
    } catch (e) { return; }
    const list = $('#ticket-list');
    if (!data.data.length) {
      list.innerHTML = '<div id="ticket-empty">No conversations here.</div>';
      return;
    }
    list.innerHTML = data.data.map((t) => `
      <div class="ticket-row ${t.id === currentTicketId ? 'selected' : ''}" data-id="${t.id}">
        <div class="name">${escapeHtml(t.customerFullName || t.customerName || 'Customer')}</div>
        ${t.customerPhone ? `<div class="phone">📱 ${escapeHtml(t.customerPhone)}</div>` : ''}
        <div class="subject">${escapeHtml(t.subject)}</div>
        <div class="meta">
          <span class="badge ${t.status === 'closed' ? 'closed' : 'open'}">${escapeHtml(t.status)}</span>
          <span>${new Date(t.lastActivity).toLocaleString()}</span>
        </div>
      </div>`).join('');
    list.querySelectorAll('.ticket-row').forEach((row) => {
      row.addEventListener('click', () => openTicket(row.dataset.id));
    });
  }

  // ---------- Chat ----------
  async function openTicket(ticketId) {
    if (currentTicketId && socket) { socket.emit('leave-ticket', { ticketId: currentTicketId }); }
    currentTicketId = ticketId;
    renderedMessageIds = new Set();
    document.querySelectorAll('.ticket-row').forEach((r) => r.classList.toggle('selected', r.dataset.id === ticketId));

    const panel = $('#chat-panel');
    panel.innerHTML = `
      <div id="chat-header"><div class="name">Loading…</div></div>
      <div id="ticket-history-panel" class="hidden"></div>
      <div id="messages"></div>
      <div id="pending-file"></div>
      <div id="composer">
        <label class="icon-btn" for="file-input">📎</label>
        <input id="file-input" type="file" class="hidden" accept="image/jpeg,image/png,image/gif,video/mp4,audio/mpeg" />
        <button id="voice-btn" title="Record a voice note">🎤</button>
        <textarea id="msg-input" placeholder="Type a reply…" rows="1"></textarea>
        <button id="send-btn" class="primary">Send</button>
      </div>`;

    let data;
    try {
      data = await api('/tickets/' + ticketId + '/messages');
    } catch (e) { return; }
    currentTicket = data.ticket;

    $('#chat-header').innerHTML = `
      <div>
        <div class="name">${escapeHtml(currentTicket.customerFullName || currentTicket.customerName || 'Customer')}${currentTicket.customerPhone ? ` <span class="phone">📱 ${escapeHtml(currentTicket.customerPhone)}</span>` : ''}</div>
        <div class="subject">${escapeHtml(currentTicket.subject)} · <span class="badge ${currentTicket.status === 'closed' ? 'closed' : 'open'}">${escapeHtml(currentTicket.status)}</span></div>
      </div>
      <div class="header-btns">
        <button id="history-btn" class="secondary-btn">History</button>
        ${currentTicket.status !== 'closed' ? '<button id="end-chat-btn">End Chat</button>' : ''}
      </div>`;

    const endChatBtn = document.getElementById('end-chat-btn');
    if (endChatBtn) { endChatBtn.addEventListener('click', () => endChat(ticketId)); }
    document.getElementById('history-btn').addEventListener('click', () => toggleHistory(currentTicket.customerId));

    const box = $('#messages');
    box.innerHTML = '';
    data.data.forEach((m) => appendMessage(m, true));
    box.scrollTop = box.scrollHeight;

    if (socket) { socket.emit('join-ticket', { ticketId }); }

    $('#file-input').addEventListener('change', onFileSelected);
    $('#send-btn').addEventListener('click', sendCurrentMessage);
    $('#voice-btn').addEventListener('click', toggleVoiceRecording);
    $('#msg-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendCurrentMessage(); }
    });
  }

  async function endChat(ticketId) {
    if (!window.confirm('End this chat? The customer will see it as closed.')) { return; }
    const btn = document.getElementById('end-chat-btn');
    if (btn) { btn.disabled = true; }
    try {
      await api('/tickets/' + ticketId + '/close', { method: 'POST' });
      if (ticketId === currentTicketId) { openTicket(ticketId); }
      loadTickets();
    } catch (e) {
      alert(e.message || 'Failed to end chat');
      if (btn) { btn.disabled = false; }
    }
  }

  /** Previous chats with this customer, not just whichever ticket is currently open (operator request). Fetches fresh every open since a new ticket could have appeared since last shown. */
  async function toggleHistory(customerId) {
    const panel = $('#ticket-history-panel');
    if (!panel) { return; }
    if (!panel.classList.contains('hidden')) { panel.classList.add('hidden'); return; }

    panel.classList.remove('hidden');
    panel.innerHTML = '<div id="ticket-history-empty">Loading…</div>';
    let data;
    try {
      data = await api('/customers/' + customerId + '/tickets');
    } catch (e) {
      panel.innerHTML = '<div id="ticket-history-empty">Failed to load history.</div>';
      return;
    }
    if (!data.data.length) {
      panel.innerHTML = '<div id="ticket-history-empty">No previous chats.</div>';
      return;
    }
    panel.innerHTML = data.data.map((t) => `
      <div class="history-row ${t.id === currentTicketId ? 'current' : ''}" data-id="${t.id}">
        <div class="subject">${escapeHtml(t.subject)}${t.id === currentTicketId ? ' (current)' : ''}</div>
        <div class="meta">
          <span class="badge ${t.status === 'closed' ? 'closed' : 'open'}">${escapeHtml(t.status)}</span>
          <span>${new Date(t.createdAt).toLocaleString()}</span>
        </div>
      </div>`).join('');
    panel.querySelectorAll('.history-row:not(.current)').forEach((row) => {
      row.addEventListener('click', () => { panel.classList.add('hidden'); openTicket(row.dataset.id); });
    });
  }

  function appendMessage(m, skipDedupe) {
    const id = m._id || (m.createdAt + Math.random());
    if (!skipDedupe) {
      if (renderedMessageIds.has(id)) { return; }
      renderedMessageIds.add(id);
    } else {
      renderedMessageIds.add(id);
    }
    const isOutgoing = currentTicket && m.sender && String(m.sender._id) === String(currentTicket.assignedTo);
    const box = $('#messages');
    if (!box) { return; }
    const el = document.createElement('div');
    el.className = 'msg ' + (isOutgoing ? 'out' : 'in');
    let html = m.content ? escapeHtml(m.content) : '';
    if (m.attachmentUrl) {
      const url = escapeHtml(m.attachmentUrl);
      // attachmentType (image/video/audio) is only present on messages
      // fetched via REST history - the raw socket.io broadcast doesn't
      // carry it (matches the real captured protocol), so a live-arriving
      // attachment falls back to trying <img> first and swapping to a
      // download link on error, which still ends up correct for images
      // and degrades gracefully for anything else.
      if (m.attachmentType === 'video') {
        html += `<video class="att" src="${url}" controls></video>`;
      } else if (m.attachmentType === 'audio' || m.attachmentType === 'voice') {
        html += `<audio src="${url}" controls></audio>`;
      } else {
        const imgId = 'img_' + Math.random().toString(36).slice(2);
        html += `<img class="att" id="${imgId}" src="${url}" onerror="document.getElementById('${imgId}').outerHTML='<a class=att-link href=&quot;${url}&quot; target=_blank rel=noopener>📎 Download attachment</a>'" />`;
      }
    }
    html += `<span class="time">${new Date(m.createdAt).toLocaleString()}</span>`;
    el.innerHTML = html;
    box.appendChild(el);
    box.scrollTop = box.scrollHeight;
  }

  async function toggleVoiceRecording() {
    const btn = $('#voice-btn');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      return;
    }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      alert('Microphone access denied or unavailable: ' + err.message);
      return;
    }

    const mimeType = ['audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus', 'audio/ogg']
      .find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
    recordedChunks = [];
    mediaRecorder = mimeType ? new MediaRecorder(stream, { mimeType }) : new MediaRecorder(stream);
    mediaRecorder.addEventListener('dataavailable', (e) => { if (e.data.size > 0) { recordedChunks.push(e.data); } });
    mediaRecorder.addEventListener('stop', async () => {
      stream.getTracks().forEach((t) => t.stop());
      btn.classList.remove('recording');
      btn.textContent = '🎤';

      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      if (blob.size === 0) { return; }

      $('#pending-file').textContent = 'Uploading voice note…';
      try {
        const ext = (mediaRecorder.mimeType || '').includes('ogg') ? 'ogg' : 'webm';
        const fd = new FormData();
        fd.append('file', blob, `voice-note.${ext}`);
        const data = await api('/upload', { method: 'POST', body: fd });
        pendingFile = data.result;
        $('#pending-file').textContent = '';
        await sendCurrentMessage();
      } catch (err) {
        $('#pending-file').textContent = 'Voice note upload failed: ' + err.message;
        pendingFile = null;
      }
    });

    mediaRecorder.start();
    btn.classList.add('recording');
    btn.textContent = '⏹';
  }

  async function onFileSelected(e) {
    const file = e.target.files[0];
    if (!file) { return; }
    $('#pending-file').textContent = 'Uploading ' + file.name + '…';
    try {
      const fd = new FormData();
      fd.append('file', file);
      const data = await api('/upload', { method: 'POST', body: fd });
      pendingFile = data.result;
      $('#pending-file').textContent = 'Attached: ' + pendingFile.attachmentName;
    } catch (err) {
      $('#pending-file').textContent = 'Upload failed: ' + err.message;
      pendingFile = null;
    }
  }

  async function sendCurrentMessage() {
    const input = $('#msg-input');
    const text = input.value.trim();
    if (!text && !pendingFile) { return; }
    const body = { message: text };
    if (pendingFile) {
      body.attachmentUrl = pendingFile.url;
      body.attachmentType = pendingFile.attachmentType;
      body.attachmentName = pendingFile.attachmentName;
      body.attachmentSize = pendingFile.attachmentSize;
    }
    $('#send-btn').disabled = true;
    try {
      const data = await api('/tickets/' + currentTicketId + '/messages', { method: 'POST', body: JSON.stringify(body) });
      appendMessage(data.data);
      input.value = '';
      pendingFile = null;
      $('#pending-file').textContent = '';
      $('#file-input').value = '';
    } catch (err) {
      alert(err.message || 'Failed to send');
    } finally {
      $('#send-btn').disabled = false;
    }
  }

  // ---------- Boot ----------
  if (token) {
    api('/tickets?limit=1').then(() => enterApp()).catch(() => { logout(); });
  }
})();
</script>
</body>
</html>
